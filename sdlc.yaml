version: v1
name: prod-trunk-demo
traceability:
  mode: warn
release_naming:
  format: semver-v-strict
  mapping: R1
stages:
  planning:
    require_milestone: true
    require_issues_assigned: true
  development:
    branch: main
    deploy_target: dev
    required_checks:
      - test
    required_reviewers:
      min_approvals: 0
  testing:
    branch_pattern: main
    required_checks:
      - test
    required_reviewers:
      min_approvals: 0
  evidencing:
    required_reviewers:
      min_approvals: 1
  deployment:
    target: production
    deploy_workflow: .github/workflows/deploy.yml
    required_checks: []
    promotion: manual
    requires_evidence_approval: true
