name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test -- --json --outputFile=jest-results.json --coverage --coverageReporters=cobertura
      - name: Send reports to LaneSync
        if: always()
        uses: ./.github/actions/lanesync-upload
        with:
          api-url: ${{ vars.SDLC_API_URL || 'https://lanesync.dev' }}
          dev-branch: "main"
          release-prefix: "main"
          pipeline: "test"
